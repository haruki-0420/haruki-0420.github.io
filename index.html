<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web制作サンプル</title>
<meta name="description" content="HTML / CSS / JavaScript で制作したサイトのサンプル。店名・住所・料金は架空です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9e3d2;--paper2:#efe9da;--line:#17140f;--muted:#5d554a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--line);font:500 16px/1.7 "Zen Kaku Gothic New",sans-serif;padding:14px}
.page{border:6px solid var(--line);border-radius:34px;min-height:calc(100vh - 28px);padding:64px 0 48px}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}
h1{font:800 clamp(34px,5vw,56px)/1.2 "Shippori Mincho B1",serif;letter-spacing:-.02em}
.sub{margin-top:10px;font-weight:700;color:var(--muted)}
.works{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:44px}
.work{display:block;text-decoration:none;color:inherit;background:var(--paper2);border:3px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 -2px var(--line);transition:transform .2s,box-shadow .2s}
.work:hover{transform:translateY(3px);box-shadow:0 5px 0 -2px var(--line)}
.work:focus-visible{outline:3px solid #b4533b;outline-offset:4px}
.work img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border-bottom:3px solid var(--line)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 20px}
.meta h2{font:800 22px/1.3 "Shippori Mincho B1",serif}
.go{flex:none;width:44px;height:44px;border:3px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;list-style:none}
.tags li{font:700 12px/1 "Zen Kaku Gothic New",sans-serif;border:2px solid var(--line);border-radius:999px;padding:6px 10px 5px;background:var(--paper)}
.note{margin-top:40px;font-size:12px;color:var(--muted)}
@media (max-width:760px){body{padding:8px}.page{border-radius:22px;padding:40px 0 32px}.wrap{width:calc(100% - 32px)}.works{grid-template-columns:1fr;gap:24px}}
</style>
</head>
<body>
<div class="page">
  <main class="wrap">
    <h1>Web制作サンプル</h1>
    <p class="sub">HTML / CSS / JavaScript。スマートフォン対応。</p>

    <div class="works">
      <a class="work" href="island/">
        <img src="assets/island.jpg" alt="島の宿 しおさい荘 トップページ" width="1440" height="900">
        <div class="meta">
          <div>
            <h2>島の宿 しおさい荘</h2>
            <ul class="tags"><li>スクロール連動アニメーション</li><li>予約フォーム</li><li>3ページ</li></ul>
          </div>
          <span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#17140f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11M9 4l5 5-5 5"/></svg></span>
        </div>
      </a>
      <a class="work" href="bakery/">
        <img src="assets/bakery.jpg" alt="こもれびベーカリー トップページ" width="1440" height="900">
        <div class="meta">
          <div>
            <h2>こもれびベーカリー</h2>
            <ul class="tags"><li>予約UI</li><li>営業中の自動表示</li><li>1ページ</li></ul>
          </div>
          <span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#17140f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11M9 4l5 5-5 5"/></svg></span>
        </div>
      </a>
    </div>

    <p class="note">店名・住所・料金は架空です。</p>
  </main>
</div>
</body>
</html>
